# ====================================================================
# EcoTrack — Render Blueprint Configuration (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ====================================================================

services:
  # 1. EcoTrack Backend REST API
  - type: web
    name: ecotrack-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_NAME
        value: "EcoTrack Administrator"
      - key: ADMIN_EMAIL
        value: admin@ecotrack.org
      - key: ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------------
  # 2. EcoTrack Frontend Web App (React + Vite Static Site)
  # ------------------------------------------------------------------
  - - type: static
  name: ecotrack-client
  rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    routes:
      # Single-Page Application (SPA) client-side rewrite fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false # Point to your backend API URL (e.g. https://ecotrack-api.onrender.com/api)
